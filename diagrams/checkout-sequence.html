<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>结账顺序图/生成订单时序图</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#fff; display:flex; justify-content:center; padding:40px; }
  </style>
</head>
<body>
<!--
  Lifeline X Coordinates:
  L1 (普通用户): 100
  L2 (前端页面): 320
  L3 (订单控制层): 540
  L4 (核心业务层): 760
  L5 (MySQL数据库): 980
-->
<svg width="1120" height="980" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Microsoft YaHei','微软雅黑',sans-serif; font-size:14px;">
  <defs>
    <!-- Solid black arrowhead for sync messages -->
    <marker id="arr_solid" markerWidth="10" markerHeight="8"
            refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0,10 4,0 8" fill="#000"/>
    </marker>
    <!-- Open arrowhead for dashed return messages -->
    <marker id="arr_dashed" markerWidth="12" markerHeight="10"
            refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <polyline points="2,1 11,5 2,9" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="miter"/>
    </marker>
  </defs>

  <!-- ===============================
       背景生命线
       =============================== -->
  <!-- Starts below the headers (y > 105) so it doesn't overlap text or boxes -->
  <line x1="100" y1="105" x2="100" y2="930" stroke="black" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="320" y1="110" x2="320" y2="930" stroke="black" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="540" y1="110" x2="540" y2="930" stroke="black" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="760" y1="110" x2="760" y2="930" stroke="black" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="980" y1="110" x2="980" y2="930" stroke="black" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- ===============================
       顶部节点 (Headers)
       =============================== -->
  <!-- L1: 普通用户 Stick Figure -->
  <g stroke="black" stroke-width="1.5" fill="none">
    <circle cx="100" cy="25" r="9" />
    <line x1="100" y1="34" x2="100" y2="55" />
    <line x1="80" y1="42" x2="120" y2="42" />
    <line x1="100" y1="55" x2="85" y2="75" />
    <line x1="100" y1="55" x2="115" y2="75" />
  </g>
  <text x="100" y="93" text-anchor="middle" fill="#000">普通用户</text>

  <!-- L2: 前端页面 -->
  <rect x="275" y="72" width="90" height="34" fill="white" stroke="black" stroke-width="1.5" rx="3" ry="3"/>
  <text x="320" y="89" text-anchor="middle" dominant-baseline="middle" fill="#000">前端页面</text>

  <!-- L3: 订单控制层 -->
  <rect x="485" y="72" width="110" height="34" fill="white" stroke="black" stroke-width="1.5" rx="3" ry="3"/>
  <text x="540" y="89" text-anchor="middle" dominant-baseline="middle" fill="#000">订单控制层</text>

  <!-- L4: 核心业务层 -->
  <rect x="705" y="72" width="110" height="34" fill="white" stroke="black" stroke-width="1.5" rx="3" ry="3"/>
  <text x="760" y="89" text-anchor="middle" dominant-baseline="middle" fill="#000">核心业务层</text>

  <!-- L5: MySQL数据库 -->
  <rect x="915" y="72" width="130" height="34" fill="white" stroke="black" stroke-width="1.5" rx="3" ry="3"/>
  <text x="980" y="89" text-anchor="middle" dominant-baseline="middle" fill="#000"><tspan font-family="'Times New Roman',serif">MySQL</tspan>数据库</text>

  <!-- ===============================
       激活块 (Activation Rectangles)
       =============================== -->
  <!-- L2 Active: 130 to 880 -->
  <rect x="314" y="130" width="12" height="750" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- L3 Active: 180 to 830 -->
  <rect x="534" y="180" width="12" height="650" fill="white" stroke="black" stroke-width="1.5"/>
  <!-- L4 Active: 230 to 780 -->
  <rect x="754" y="230" width="12" height="550" fill="white" stroke="black" stroke-width="1.5"/>
  
  <!-- L5 Active small blocks -->
  <rect x="974" y="280" width="12" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="974" y="380" width="12" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="974" y="480" width="12" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="974" y="580" width="12" height="50" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="974" y="680" width="12" height="50" fill="white" stroke="black" stroke-width="1.5"/>

  <!-- ===============================
       交互消息 (Message Arrows & Text)
       =============================== -->

  <!-- 1. 点击提交结算 L1 -> L2 -->
  <polyline points="100,130 314,130" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="120" y="123" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">1</tspan>、连同优惠券提交结算</text>

  <!-- 2. 发送结算请求 L2 -> L3 -->
  <polyline points="326,180 534,180" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="346" y="173" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">2</tspan>、发送支付结算请求</text>

  <!-- 3. 调用生成订单逻辑 L3 -> L4 -->
  <polyline points="546,230 754,230" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="566" y="223" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">3</tspan>、开启交易隔离与订单逻辑</text>

  <!-- 4. 查询实时库存 L4 -> L5 -->
  <polyline points="766,280 974,280" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="786" y="273" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">4</tspan>、查询实时商品库存</text>

  <!-- 5. 返回库存余量 L5 -> L4 -->
  <polyline points="974,330 766,330" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="786" y="323" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">5</tspan>、返回充足库存余量</text>

  <!-- 6. 执行库存扣减 L4 -> L5 -->
  <polyline points="766,380 974,380" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="786" y="373" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">6</tspan>、执行库存持久化扣减</text>

  <!-- 7. 扣减成功 L5 -> L4 -->
  <polyline points="974,430 766,430" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="786" y="423" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">7</tspan>、扣减反馈成功</text>

  <!-- 8. 插入新订单记录 L4 -> L5 -->
  <polyline points="766,480 974,480" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="786" y="473" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">8</tspan>、插入新订单记录及快照</text>

  <!-- 9. 插入成功 L5 -> L4 -->
  <polyline points="974,530 766,530" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="786" y="523" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">9</tspan>、落库插入成功</text>

  <!-- 10. 清除购物车记录 L4 -> L5 -->
  <polyline points="766,580 974,580" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="786" y="573" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">10</tspan>、清除购物车关联记录</text>

  <!-- 11. 清除成功 L5 -> L4 -->
  <polyline points="974,630 766,630" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="786" y="623" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">11</tspan>、清除成功反馈</text>

  <!-- 12. 校验并核销优惠券 L4 -> L5 -->
  <polyline points="766,680 974,680" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arr_solid)"/>
  <text x="786" y="673" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">12</tspan>、锁定并核销所选优惠券</text>

  <!-- 13. 核销成功 L5 -> L4 -->
  <polyline points="974,730 766,730" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="786" y="723" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">13</tspan>、优惠券核销成功反馈</text>

  <!-- 14. 事务执行成功 L4 -> L3 -->
  <polyline points="754,780 546,780" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="566" y="773" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">14</tspan>、整体事务隔离执行成功</text>

  <!-- 15. 返回成功结果 L3 -> L2 -->
  <polyline points="534,830 326,830" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="346" y="823" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">15</tspan>、封装状态码并返回结果</text>

  <!-- 16. 展示支付结果 L2 -> L1 -->
  <polyline points="314,880 100,880" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arr_dashed)"/>
  <text x="120" y="873" text-anchor="start" fill="#000"><tspan font-family="'Times New Roman',serif">16</tspan>、展示支付成功及金额结果</text>

</svg>
</body>
</html>
