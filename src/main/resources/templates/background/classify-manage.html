<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"
          name="viewport">
    <title>商品分类</title>
    <!-- Favicon and Touch Icons -->
    <link href="common/favicon.png" rel="shortcut icon" type="image/png">
    <link rel="stylesheet" href="background/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="background/modules/ionicons/css/ionicons.min.css">
    <link rel="stylesheet" href="background/modules/fontawesome/web-fonts-with-css/css/fontawesome-all.min.css">

    <link rel="stylesheet" href="background/modules/summernote/summernote-lite.css">
    <link rel="stylesheet" href="background/modules/flag-icon-css/css/flag-icon.min.css">
    <link rel="stylesheet" href="background/css/style.css">
    <link rel="stylesheet" href="common/css/xtiper.css">
    <link rel="stylesheet" href="common/css/sweetalert.css">
    <link rel="stylesheet" href="common/datatable/dataTables.bootstrap4.min.css"/>
    <style>
        .add-bar {
            display: flex; align-items: center; gap: 12px;
            padding: 15px 20px; border-radius: 8px;
            background: linear-gradient(135deg, #f8f9fa 0%, #fff 100%);
            border: 1px dashed #d0d0d0;
        }
        .add-bar input { border-radius: 6px; font-size: 14px; }
        .add-bar input:focus { border-color: #6777ef; box-shadow: 0 0 0 3px rgba(103,119,239,0.15); }
        .add-bar .btn { border-radius: 6px; padding: 8px 20px; font-weight: 600; white-space: nowrap; }

        #example1 thead th {
            background: #f8f9fa; font-weight: 700; font-size: 13px;
            color: #555; border-bottom: 2px solid #dee2e6;
            vertical-align: middle; padding: 12px 10px;
        }
        #example1 tbody td { vertical-align: middle; padding: 8px 10px; }
        #example1 tbody tr { transition: background 0.2s; }
        #example1 tbody tr:hover { background: #f2f6ff; }

        .id-badge {
            display: inline-block; background: #eef0ff; color: #6777ef;
            font-weight: 700; font-size: 13px; padding: 4px 14px;
            border-radius: 15px; letter-spacing: 0.5px;
        }
        .count-badge {
            display: inline-block; background: #e8f5e9; color: #47c363;
            font-weight: 600; font-size: 13px; padding: 4px 12px;
            border-radius: 15px;
        }
        .count-badge.empty { background: #f5f5f5; color: #aaa; }
        .name-input {
            border: 1px solid #e0e0e0; border-radius: 6px; text-align: center;
            font-size: 14px; font-weight: 500; transition: all 0.2s;
        }
        .name-input:focus { border-color: #6777ef; box-shadow: 0 0 0 3px rgba(103,119,239,0.12); }
        .time-text { color: #888; font-size: 13px; }
        .btn-del { border-radius: 6px; font-size: 12px; padding: 5px 12px; font-weight: 600; min-width: 85px; margin-bottom: 5px; }
    </style>
</head>

<body>
<div id="app">
    <div class="main-wrapper">
        <div class="navbar-bg"></div>
        <div th:replace="common/background-common::navbar(currUri='classify-manage')"></div>
        <div th:replace="common/background-common::sidebar(currUri='classify-manage')"></div>

        <div class="main-content">
            <section class="section">
                <h1 class="section-header">
                    <div>商品分类 <i class="ion ion-ios-color-filter"></i></div>
                </h1>
                <div class="row">
                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <div class="card mb-3">
                            <div class="card-body row">
                                <div class="col-12 custom-control-inline">
                                    <input type="text" class="form-control" id="newClassify" placeholder="请输入新增的商品分类名称 ..." >
                                    <button class="btn btn-success" onclick="addClassify()"><i class="fa fa-plus"> 新增</i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xs-12 col-sm-12 col-md-12">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table id="example1" class="table table-bordered table-hover display" style="text-align: center">
                                        <thead>
                                        <tr>
                                            <th style="width:80px">序号</th>
                                            <th>分类名称</th>
                                            <th style="width:100px">商品数</th>
                                            <th>创建时间</th>
                                            <th style="width:180px">操作</th>
                                        </tr>
                                        </thead>
                                        <tbody style="font-size: 13px">
                                            <tr th:each="classify, stat:${classifies}">
                                                <td>
                                                    <span class="id-badge" th:text="${stat.count}"></span>
                                                </td>
                                                <td>
                                                    <input th:onchange="updateClassify([[${classify.id}]])" th:id="${'classify'+classify.id}" class="form-control name-input" type="text" th:value="${classify.name}">
                                                </td>
                                                <td>
                                                    <span th:if="${classify.count > 0}" class="count-badge" th:text="${classify.count + ' 件'}"></span>
                                                    <span th:if="${classify.count == 0}" class="count-badge empty">0 件</span>
                                                </td>
                                                <td>
                                                    <span class="time-text" th:text="${#dates.format(classify.createTime,'yyyy-MM-dd HH:mm')}"></span>
                                                </td>
                                                <td style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                                                    <button th:onclick="editWiki([[${classify.id}]])" class="btn btn-outline-primary btn-del"><i class="ion ion-edit"></i> 百科</button>
                                                    <button th:if="${classify.count > 0}" type="button" class="btn btn-outline-secondary btn-del" data-toggle="tooltip" data-placement="top" title="" data-original-title="当前分类下已存在商品，无法删除">
                                                        <i class="ion ion-locked"></i> 不可删
                                                    </button>
                                                    <button th:if="${classify.count == 0}" th:onclick="deleteClassify([[${classify.id}]])" class="btn btn-outline-danger btn-del"><i class="ion ion-trash-b"></i> 删除</button>
                                                </td>
                                            </tr>
                                        </tbody>
                                        <thead>
                                        </thead>
                                    </table>
                                </div>

                            </div>
                        </div><!-- end card-->
                    </div>
                </div>
            </section>
        </div>

        <div th:replace="common/background-common::footer"></div>
    </div>
</div>

<!-- 维基百科编辑模态框 -->
<div class="modal fade" id="wikiModal" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑咖啡百科 · <span id="wikiTitle" class="text-primary"></span></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="wikiId">
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">展示权重</label>
                    <div class="col-sm-4">
                        <input type="number" class="form-control" id="wikiSortOrder" placeholder="数字越小越靠前 (默认99)">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">封面图地址</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="wikiCoverImage" placeholder="例如: front/assets/img/blog/1.jpg">
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label text-right">长篇文案</label>
                    <div class="col-sm-9">
                        <textarea id="wikiDescription" class="summernote"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer pb-4 pr-4">
                <button type="button" class="btn btn-secondary" onclick="$('#wikiModal').modal('hide')">取消关闭</button>
                <button type="button" class="btn btn-primary" onclick="submitWiki()">保存更改</button>
            </div>
        </div>
    </div>
</div>

<script src="background/modules/jquery.min.js"></script>
<script src="common/js/xtiper.min.js"></script>
<script src="common/js/sweetalert.js"></script>
<script src="common/js/custom.js"></script>
<script src="common/datatable/jquery.dataTables.min.js"></script>
<script src="common/datatable/dataTables.bootstrap4.min.js"></script>
<script src="background/modules/popper.js"></script>
<script src="background/modules/tooltip.js"></script>
<script src="background/modules/bootstrap/js/bootstrap.min.js"></script>
<script src="background/modules/nicescroll/jquery.nicescroll.min.js"></script>
<script src="background/modules/scroll-up-bar/dist/scroll-up-bar.min.js"></script>
<script src="background/js/sa-functions.js"></script>

<script src="background/modules/chart.min.js"></script>
<script src="background/modules/summernote/summernote-lite.js"></script>

<script src="background/js/scripts.js"></script>

<script>
    // START CODE FOR BASIC DATA TABLE
    $(document).ready(function() {
        $('#example1').DataTable({
            language: {
                "sProcessing": "处理中...",
                "sLengthMenu": "显示 _MENU_ 项结果",
                "sZeroRecords": "没有匹配结果",
                "sInfo": "显示第 _START_ 至 _END_ 项结果，共 _TOTAL_ 项",
                "sInfoEmpty": "显示第 0 至 0 项结果，共 0 项",
                "sInfoFiltered": "(由 _MAX_ 项结果过滤)",
                "sInfoPostFix": "",
                "sSearch": "搜索:",
                "sUrl": "",
                "sEmptyTable": "表中数据为空",
                "sLoadingRecords": "载入中...",
                "sInfoThousands": ",",
                "oPaginate": {
                    "sFirst": "首页",
                    "sPrevious": "上页",
                    "sNext": "下页",
                    "sLast": "末页"
                },
                "oAria": {
                    "sSortAscending": ": 以升序排列此列",
                    "sSortDescending": ": 以降序排列此列"
                }
            },
            "aoColumnDefs": [ { "bSortable": false, "aTargets": [ 1,3,4 ]}],
        });
    });

    // 唤起百科编辑面板
    function editWiki(id) {
        $.ajax({
            url: "getClassify?id=" + id,
            type: "GET",
            success: function(res) {
                if(res.code === 200) {
                    var data = res.data;
                    $('#wikiId').val(data.id);
                    $('#wikiTitle').text(data.name);
                    $('#wikiSortOrder').val(data.sortOrder ? data.sortOrder : 99);
                    $('#wikiCoverImage').val(data.coverImage ? data.coverImage : "");
                    
                    // 初始化或设置富文本内容
                    $('#wikiDescription').summernote('code', data.description ? data.description : "");
                    
                    // 显示弹窗
                    $('#wikiModal').modal('show');
                } else {
                    xtip.msg("获取分类信息失败");
                }
            }
        });
    }

    // 提交百科更新
    function submitWiki() {
        var id = $('#wikiId').val();
        var sortOrder = $('#wikiSortOrder').val() || 99;
        var coverImage = $('#wikiCoverImage').val() || "";
        var description = $('#wikiDescription').summernote('code');

        $.ajax({
            url: "updateWiki",
            type: "POST",
            data: {
                id: id,
                sortOrder: sortOrder,
                coverImage: coverImage,
                description: description
            },
            success: function(res) {
                if(res.code === 200) {
                    $('#wikiModal').modal('hide');
                    xtip.msg("百科更新成功！", {icon: 'success'});
                    setTimeout(function() {
                        window.location.reload();
                    }, 1000);
                } else {
                    xtip.msg(res.message || "更新失败");
                }
            }
        });
    }

</script>
</body>
</html>
