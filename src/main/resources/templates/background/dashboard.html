<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no"
          name="viewport">
    <title>仪表盘</title>
    <!-- Favicon and Touch Icons -->
    <link href="common/favicon.png" rel="shortcut icon" type="image/png">
    <link rel="stylesheet" href="background/modules/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="background/modules/ionicons/css/ionicons.min.css">
    <link rel="stylesheet" href="background/modules/fontawesome/web-fonts-with-css/css/fontawesome-all.min.css">

    <link rel="stylesheet" href="background/modules/summernote/summernote-lite.css">
    <link rel="stylesheet" href="background/modules/flag-icon-css/css/flag-icon.min.css">
    <link rel="stylesheet" href="background/css/style.css">
    <link rel="stylesheet" href="common/css/xtiper.css">
    <link rel="stylesheet" href="common/css/sweetalert.css">
    <style>
        /* Global Font Bump */
        body {
            font-size: 15px !important;
        }
        /* Enterprise Dashboard Layout & Font Fixes */
        .card-statistic-1 {
            display: flex;
            flex-direction: row !important;
            align-items: center;
            padding: 25px 20px;
        }
        .card-statistic-1 .card-icon {
            width: 65px !important;
            height: 65px !important;
            border-radius: 50% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 28px !important;
            color: #fff !important;
            margin-right: 20px !important;
            margin-top: 0 !important;
            position: static !important;
        }
        .card-statistic-1 .card-wrap {
            flex: 1;
            padding: 0 !important;
        }
        .card-statistic-1 .card-header h4 {
            font-size: 15px !important;
            font-weight: 600 !important;
            color: #6c757d !important;
            margin: 0 0 5px 0 !important;
            text-transform: none !important;
            letter-spacing: 0 !important;
        }
        .card-statistic-1 .card-body {
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #34395e !important;
            padding: 0 !important;
        }
        /* Chart Headers & General Card Fixes */
        .card .card-header {
            border-bottom: 1px solid #f9f9f9 !important;
            padding: 18px 25px !important;
            min-height: auto !important;
            background-color: #fff;
        }
        .card .card-header h4 {
            font-size: 16px !important;
            font-weight: 700 !important;
            color: #34395e !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1.5 !important;
        }
    </style>
</head>

<body>
<div id="app">
    <div class="main-wrapper">
        <div class="navbar-bg"></div>
        <div th:replace="common/background-common::navbar(currUri='dashboard')"></div>
        <div th:replace="common/background-common::sidebar(currUri='dashboard')"></div>

        <div class="main-content">
            <section class="section">
                <h1 class="section-header">
                    <div>数据统计 <i class="ion ion-stats-bars"></i></div>
                </h1>
                <div class="row">
                    <!-- 统计卡片 -->
                    <div class="col-lg-3 col-md-6 col-sm-6 col-12">
                        <div class="card card-statistic-1">
                            <div class="card-icon bg-primary">
                                <i class="far fa-money-bill-alt"></i>
                            </div>
                            <div class="card-wrap">
                                <div class="card-header">
                                    <h4>总销售额</h4>
                                </div>
                                <div class="card-body">
                                    ¥<span th:text="${#numbers.formatDecimal(totalRevenue, 1, 2)}">0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-6 col-12">
                        <div class="card card-statistic-1">
                            <div class="card-icon bg-danger">
                                <i class="far fa-newspaper"></i>
                            </div>
                            <div class="card-wrap">
                                <div class="card-header">
                                    <h4>总订单数</h4>
                                </div>
                                <div class="card-body" th:text="${totalOrders}">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-6 col-12">
                        <div class="card card-statistic-1">
                            <div class="card-icon bg-warning">
                                <i class="far fa-user"></i>
                            </div>
                            <div class="card-wrap">
                                <div class="card-header">
                                    <h4>总用户数</h4>
                                </div>
                                <div class="card-body" th:text="${totalUsers}">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 col-sm-6 col-12">
                        <div class="card card-statistic-1">
                            <div class="card-icon bg-success">
                                <i class="fas fa-coffee"></i>
                            </div>
                            <div class="card-wrap">
                                <div class="card-header">
                                    <h4>总商品数</h4>
                                </div>
                                <div class="card-body" th:text="${totalCommodities}">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 图表区域 -->
                <div class="row">
                    <div class="col-lg-8 col-md-12 col-12 col-sm-12">
                        <div class="card">
                            <div class="card-header">
                                <h4>近7天订单趋势</h4>
                            </div>
                            <div class="card-body">
                                <div id="salesTrendChart" style="height: 300px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-12 col-12 col-sm-12">
                        <div class="card">
                            <div class="card-header">
                                <h4>订单状态分布</h4>
                            </div>
                            <div class="card-body">
                                <div id="statusChart" style="height: 300px;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-header">
                                <h4>销量 Top5 商品</h4>
                            </div>
                            <div class="card-body">
                                <div id="top5Chart" style="height: 300px;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div th:replace="common/background-common::footer"></div>
    </div>
</div>

<script src="background/modules/jquery.min.js"></script>
<script src="common/js/xtiper.min.js"></script>
<script src="common/js/sweetalert.js"></script>
<script src="common/js/custom.js"></script>
<script src="background/modules/popper.js"></script>
<script src="background/modules/tooltip.js"></script>
<script src="background/modules/bootstrap/js/bootstrap.min.js"></script>
<script src="background/modules/nicescroll/jquery.nicescroll.min.js"></script>
<script src="background/modules/scroll-up-bar/dist/scroll-up-bar.min.js"></script>
<script src="background/js/sa-functions.js"></script>

<script src="background/modules/echarts.min.js"></script>
<script src="background/modules/summernote/summernote-lite.js"></script>

<script src="background/js/scripts.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    // ============================================
    // 1. 近7天订单趋势 (高级折线图)
    // ============================================
    var salesTrendData = [[${salesTrend}]] || [];
    var trendLabels = salesTrendData.map(item => item.date);
    var trendCounts = salesTrendData.map(item => item.count);

    var trendChart = echarts.init(document.getElementById('salesTrendChart'));
    var trendOption = {
        tooltip: {
            trigger: 'axis',
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            textStyle: { color: '#333' },
            extraCssText: 'box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border-radius: 8px;'
        },
        grid: { left: '2%', right: '4%', bottom: '2%', top: '10%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: trendLabels,
            axisLine: { lineStyle: { color: '#e4e6fc' } },
            axisLabel: { color: '#6c757d', margin: 15 }
        },
        yAxis: {
            type: 'value',
            splitLine: { lineStyle: { color: 'rgba(0, 0, 0, 0.05)', type: 'dashed' } },
            axisLabel: { color: '#6c757d' }
        },
        series: [{
            name: '订单数',
            type: 'line',
            smooth: true,
            symbol: 'emptyCircle',
            symbolSize: 8,
            itemStyle: {
                color: '#6777ef',
                borderWidth: 2
            },
            lineStyle: {
                width: 3,
                color: '#6777ef',
                shadowColor: 'rgba(103, 119, 239, 0.3)',
                shadowBlur: 10,
                shadowOffsetY: 8
            },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: 'rgba(103, 119, 239, 0.4)' },
                    { offset: 1, color: 'rgba(103, 119, 239, 0.01)' }
                ])
            },
            data: trendCounts
        }]
    };
    trendChart.setOption(trendOption);

    // ============================================
    // 2. 订单状态分布 (悬浮环形图)
    // ============================================
    var statusDataRaw = [[${statusDistribution}]] || [];
    const statusMap = { '-1': '已取消', '0': '待发货', '1': '待收货', '2': '已完成' };
    const colorMap = { '-1': '#fc544b', '0': '#ffa426', '1': '#6777ef', '2': '#47c363' };
    
    var pieData = statusDataRaw.map(item => ({
        value: item.count,
        name: statusMap[item.status.toString()] || '未知',
        itemStyle: { color: colorMap[item.status.toString()] || '#999' }
    }));

    var statusChart = echarts.init(document.getElementById('statusChart'));
    var statusOption = {
        tooltip: {
            trigger: 'item',
            formatter: '{a} <br/>{b}: {c}单 ({d}%)',
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            textStyle: { color: '#333' },
            extraCssText: 'box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border-radius: 8px;'
        },
        legend: {
            bottom: '0%',
            left: 'center',
            icon: 'circle',
            itemStyle: {
                borderWidth: 0
            }
        },
        series: [
            {
                name: '订单状态',
                type: 'pie',
                radius: ['45%', '70%'],
                center: ['50%', '42%'],
                avoidLabelOverlap: false,
                itemStyle: {
                    borderRadius: 10,
                    borderColor: '#fff',
                    borderWidth: 2
                },
                label: {
                    show: false,
                    position: 'center'
                },
                emphasis: {
                    label: {
                        show: true,
                        fontSize: '22',
                        fontWeight: 'bold'
                    }
                },
                labelLine: {
                    show: false
                },
                data: pieData
            }
        ]
    };
    statusChart.setOption(statusOption);

    // ============================================
    // 3. 销量 Top5 商品 (渐变柱状图)
    // ============================================
    var top5DataRaw = [[${top5Products}]] || [];
    var top5Labels = top5DataRaw.map(item => item.name);
    var top5Counts = top5DataRaw.map(item => item.totalSold);

    var top5Chart = echarts.init(document.getElementById('top5Chart'));
    var top5Option = {
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'shadow' },
            backgroundColor: 'rgba(255, 255, 255, 0.9)',
            textStyle: { color: '#333' },
            extraCssText: 'box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border-radius: 8px;'
        },
        grid: { left: '2%', right: '3%', bottom: '2%', top: '10%', containLabel: true },
        xAxis: {
            type: 'category',
            data: top5Labels,
            axisTick: { alignWithLabel: true },
            axisLine: { lineStyle: { color: '#e4e6fc' } },
            axisLabel: { color: '#6c757d', interval: 0, formatter: function(value) {
                // 如果文字过长则换行
                var len = value.length;
                if (len > 8) return value.substring(0, 8) + '...';
                return value;
            }}
        },
        yAxis: {
            type: 'value',
            splitLine: { lineStyle: { color: 'rgba(0, 0, 0, 0.05)', type: 'dashed' } },
            axisLabel: { color: '#6c757d' }
        },
        series: [{
            name: '总销量',
            type: 'bar',
            barWidth: '35%',
            itemStyle: {
                borderRadius: [6, 6, 0, 0],
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#6777ef' },
                    { offset: 1, color: 'rgba(103,119,239, 0.1)' }
                ])
            },
            emphasis: {
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#fc544b' },
                        { offset: 1, color: 'rgba(252,84,75, 0.1)' }
                    ])
                }
            },
            data: top5Counts
        }]
    };
    top5Chart.setOption(top5Option);

    // 窗口大小变化时让图表自适应缩放
    window.addEventListener('resize', function() {
        trendChart.resize();
        statusChart.resize();
        top5Chart.resize();
    });

    /*]]>*/
</script>
</body>
</html>
