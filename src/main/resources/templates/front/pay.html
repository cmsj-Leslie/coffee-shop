<!DOCTYPE html>
<html dir="ltr" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>待支付</title>

    <!-- Vendor Stylesheets -->
    <link href="front/assets/css/plugins/bootstrap.min.css" rel="stylesheet">
    <link href="front/assets/css/plugins/animate.min.css" rel="stylesheet">
    <link href="front/assets/css/plugins/magnific-popup.css" rel="stylesheet">
    <link href="front/assets/css/plugins/slick.css" rel="stylesheet">
    <link href="front/assets/css/plugins/slick-theme.css" rel="stylesheet">
    <link href="front/assets/css/plugins/ion.rangeSlider.min.css" rel="stylesheet">

    <!-- Icon Fonts -->
    <link href="front/assets/fonts/flaticon/flaticon.css" rel="stylesheet">
    <link href="front/assets/fonts/font-awesome/css/all.min.css" rel="stylesheet">

    <!-- Coffeez Style sheet -->
    <link href="front/assets/css/style.css" rel="stylesheet">
    <link href="common/css/xtiper.css" rel="stylesheet">
    <link href="common/css/sweetalert.css" rel="stylesheet">

    <!-- Favicon -->
    <link href="favicon.ico" rel="icon" sizes="32x32" type="image/png">

</head>

<body>

    <div th:replace="common/front-common::#front1"></div>
    <div th:replace="common/front-common::#androNewsletterPopup"></div>
    <div th:replace="common/front-common::#front4"></div>
    <div th:replace="common/front-common::#front5"></div>
    <div th:replace="common/front-common::#front6"></div>
    <div th:replace="common/front-common::#front7"></div>
    <div th:replace="common/front-common::#front8"></div>

    <!-- Subheader Start -->
    <div class="andro_subheader pattern-bg primary-bg">
        <div class="container">
            <div class="andro_subheader-inner">
                <h1 th:if="${!hasInsufficientStock}">待支付</h1>
                <h1 th:if="${hasInsufficientStock}" style="color: #ff6b6b;">部分商品库存不足</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="index.html">主页</a></li>
                    </ol>
                </nav>
            </div>
        </div>
    </div>
    <!-- Subheader End -->

    <div class="section">
        <div class="imgs-wrapper">
            <img alt="veg" class="d-none d-lg-block" src="front/assets/img/products/1.png">
            <img alt="veg" class="d-none d-lg-block" src="front/assets/img/products/14.png">
        </div>
        <div class="container">
            <!-- Cart Table Start -->
            <table class="andro_responsive-table">
                <thead>
                    <tr>
                        <th>商品信息</th>
                        <th>商品单价</th>
                        <th>购买数量</th>
                        <th>商品状态</th>
                        <th>小计</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cart:${carts}">
                        <td data-title="Product">
                            <div class="andro_cart-product-wrapper">
                                <img alt="prod1" th:src="${cart.commodity.img}">
                                <div class="andro_cart-product-body">
                                    <h6><a th:href="@{product(id=${cart.commodityId})}"
                                            th:text="${cart.commodity.name}"></a>
                                    </h6>
                                    <p th:text="${cart.commodity.info}"></p>
                                </div>
                            </div>
                        </td>
                        <td data-title="Price"><strong th:text="${'¥ '+cart.commodity.currentPrice}"></strong></td>
                        <td class="quantity" data-title="Quantity">
                            <strong th:text="${cart.count +'（件）'}"></strong>
                        </td>
                        <td class="andro_product-stock instock" data-title="Status">
                            <span class="andro_product-stock instock" th:if="${cart.commodity.status == 1}">上架</span>
                            <span class="andro_product-stock outofstock"
                                th:if="${cart.commodity.status == 0}">该商品已下架</span>
                            <span class="text-danger"
                                th:if="${cart.count > cart.commodity.inventory}">库存不足（剩余：[[${cart.commodity.inventory}]]）</span>
                        </td>
                        <td data-title="Subtotal">
                            <strong th:text="${'¥ ' + (cart.commodity.currentPrice * cart.count)}"
                                style="color: #c38241;"></strong>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Address Selection -->
            <div class="form-group" style="margin-top: 20px;">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">收货地址：</label>
                <select class="form-control" id="addressId">
                    <option th:each="address:${addresses}" th:if="${address.isDefault == 1}"
                        th:text="${address.name + ' - ' + address.address + ' - ' + address.phone}"
                        th:value="${address.id}"></option>
                    <option th:each="address:${addresses}" th:if="${address.isDefault == 0}"
                        th:text="${address.name + ' - ' + address.address + ' - ' + address.phone}"
                        th:value="${address.id}"></option>
                </select>
            </div>
            <!-- Cart Table End -->

            <!-- Coupon Selection -->
            <div class="form-group" style="margin-top: 15px;" th:if="${userCoupons != null and !#lists.isEmpty(userCoupons)}">
                <label style="font-weight: bold; margin-bottom: 10px; display: block;">优惠券：</label>
                <select class="form-control" id="couponId" onchange="applyCoupon()">
                    <option value="">不使用优惠券</option>
                    <option th:each="uc:${userCoupons}"
                            th:value="${uc.id}"
                            th:attr="data-type=${uc.coupon.type},data-reduce=${uc.coupon.reduceAmount},data-discount=${uc.coupon.discount}"
                            th:text="${uc.coupon.name + '（截止' + #dates.format(uc.coupon.endTime,'MM-dd') + '）'}">
                    </option>
                </select>
                <small id="couponTip" style="color:#28a745; margin-top:5px; display:block;"></small>
            </div>

            <!-- Order Summary -->
            <div style="background: #f8f8f8; padding: 20px; border-radius: 8px; margin-top: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                    <div>
                        <p style="margin: 5px 0;">商品数量：<strong th:text="${totalCount + '件'}"></strong></p>
                        <p style="margin: 5px 0;">商品总价：<strong th:text="${'¥ ' + totalPrice}"></strong></p>
                        <p style="margin: 5px 0; color: #28a745;">已优惠：<strong th:text="${'¥ ' + savedPrice}"></strong>
                        </p>
                        <p id="couponDiscount" style="margin: 5px 0; color: #ff6b6b; display:none;">优惠券减免：<strong id="couponAmount">¥0</strong></p>
                    </div>
                    <div style="text-align: right;">
                        <h4 style="color: #c38241;">待支付：<strong id="finalPrice" th:text="${'¥ ' + totalPrice}"></strong></h4>
                    </div>
                </div>
            </div>

            <br>
            <div th:if="${addresses.size() > 0}">
                <a class="andro_btn-custom shadow-none" href="javascript:void(0)" th:if="${!hasInsufficientStock}"
                    onclick="doBatchBuy()" style="padding: 12px 40px;">立即购买</a>
                <a class="andro_btn-custom shadow-none" style="background: red;color: white; padding: 12px 40px;"
                    th:if="${hasInsufficientStock}">部分商品库存不足，请返回修改！</a>
            </div>

            <div th:if="${addresses.size() == 0}">
                <a class="andro_btn-custom shadow-none" href="javascript:void(0)" 
                    onclick="xtip.msg('您还没有收货地址无法下单，即将跳转去添加...', {icon: 'w'}); setTimeout(() => { window.location.href = 'address'; }, 1500);"
                    style="background: red;color: white; padding: 12px 40px;">缺少收货地址，点击去添加！</a>
            </div>

        </div>
    </div>

    <!-- Instagram Start -->
    <div th:replace="common/front-common::#instagram"></div>
    <!-- Instagram End -->

    <!-- Footer Start -->
    <div th:replace="common/front-common::#footer"></div>
    <!-- Footer End -->

    <!-- Vendor Scripts -->
    <script src="front/assets/js/plugins/jquery-3.4.1.min.js"></script>
    <script src="front/assets/js/plugins/popper.min.js"></script>
    <script src="front/assets/js/plugins/waypoint.js"></script>
    <script src="front/assets/js/plugins/bootstrap.min.js"></script>
    <script src="front/assets/js/plugins/jquery.magnific-popup.min.js"></script>
    <script src="front/assets/js/plugins/jquery.slimScroll.min.js"></script>
    <script src="front/assets/js/plugins/imagesloaded.min.js"></script>
    <script src="front/assets/js/plugins/jquery.steps.min.js"></script>
    <script src="front/assets/js/plugins/jquery.countdown.min.js"></script>
    <script src="front/assets/js/plugins/isotope.pkgd.min.js"></script>
    <script src="front/assets/js/plugins/slick.min.js"></script>
    <script src="front/assets/js/plugins/ion.rangeSlider.min.js"></script>
    <script src="front/assets/js/plugins/jquery.zoom.min.js"></script>


    <!-- Coffeez Scripts -->
    <script src="front/assets/js/main.js"></script>
    <script src="common/js/xtiper.min.js"></script>
    <script src="common/js/sweetalert.js"></script>
    <script src="common/js/custom.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var totalPrice = /*[[${totalPrice}]]*/ 0;
        var cartIds = /*[[${cartIds}]]*/ '';

        function applyCoupon() {
            var sel = document.getElementById('couponId');
            var opt = sel.options[sel.selectedIndex];
            if (!sel.value) {
                document.getElementById('finalPrice').innerText = '¥ ' + totalPrice.toFixed(2);
                document.getElementById('couponDiscount').style.display = 'none';
                document.getElementById('couponTip').innerText = '';
                return;
            }
            var type = opt.getAttribute('data-type');
            var reduce = parseFloat(opt.getAttribute('data-reduce') || 0);
            var discount = parseFloat(opt.getAttribute('data-discount') || 1);
            var actual = (type == '1') ? totalPrice - reduce : totalPrice * discount;
            var saved = totalPrice - Math.max(actual, 0);
            document.getElementById('finalPrice').innerText = '¥ ' + Math.max(actual, 0).toFixed(2);
            document.getElementById('couponAmount').innerText = '¥ ' + saved.toFixed(2);
            document.getElementById('couponDiscount').style.display = 'block';
            document.getElementById('couponTip').innerText = '已选优惠券，节省 ¥' + saved.toFixed(2);
        }

        function doBatchBuy() {
            var addressId = document.getElementById('addressId').value;
            var couponEl = document.getElementById('couponId');
            var userCouponId = couponEl ? couponEl.value : '';
            batchBuyCommodityWithCoupon(cartIds, addressId, userCouponId);
        }
        /*]]>*/
    </script>

</body>

</html>
