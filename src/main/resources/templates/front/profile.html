<!DOCTYPE html>
<html lang="en" dir="ltr" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的资料</title>

  <!-- Vendor Stylesheets -->
  <link rel="stylesheet" href="front/assets/css/plugins/bootstrap.min.css">
  <link rel="stylesheet" href="front/assets/css/plugins/animate.min.css">
  <link rel="stylesheet" href="front/assets/css/plugins/magnific-popup.css">
  <link rel="stylesheet" href="front/assets/css/plugins/slick.css">
  <link rel="stylesheet" href="front/assets/css/plugins/slick-theme.css">
  <link rel="stylesheet" href="front/assets/css/plugins/ion.rangeSlider.min.css">

  <!-- Icon Fonts -->
  <link rel="stylesheet" href="front/assets/fonts/flaticon/flaticon.css">
  <link rel="stylesheet" href="front/assets/fonts/font-awesome/css/all.min.css">

  <!-- Coffeez Style sheet -->
  <link rel="stylesheet" href="front/assets/css/style.css">
  <link rel="stylesheet" href="common/css/xtiper.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">

</head>

<body>

  <div th:replace="common/front-common::#front1"></div>
  <div th:replace="common/front-common::#androNewsletterPopup"></div>
  <div th:replace="common/front-common::#front4"></div>
  <div th:replace="common/front-common::#front5"></div>
  <div th:replace="common/front-common::#front6"></div>
  <div th:replace="common/front-common::#front7"></div>
  <div th:replace="common/front-common::#front8"></div>

  <div class="section">
    <div class="imgs-wrapper">
      <img src="front/assets/img/products/1.png" alt="veg" class="d-none d-lg-block">
      <img src="front/assets/img/products/14.png" alt="veg" class="d-none d-lg-block">
    </div>
    <div class="container">
      <div>
        <div class="row">
          <!-- Sidebar Start -->
          <div class="col-lg-4">
            <div class="sidebar">

              <!-- About Author Start -->
              <div class="sidebar-widget widget-about-author">
                <div class="widget-about-author-inner">
                  <img class="img-thumbnail" th:src="${user.img}" onclick="javaScript:$('#avatar').click()" title="更换头像" alt="author">
                  <h5 th:text="${user.name}"></h5>
                  <p th:text="${user.info}"></p>
                </div>
                <ul class="andro_sm">
                  <li> <a href="#"><i class="fa flaticon-email" title="邮箱"> [[${user.email}]]</i></a> </li>
                </ul>
              </div>
              <!-- About Author End -->
            </div>
          </div>
          <!-- Sidebar End -->
          <div class="col-lg-7 offset-lg-1">
            <input style="display: none" id="avatar" type="file" onchange="uploadAvatar()">
            <div class="andro_auth-form shadow-sm" style="border-radius: 12px; padding: 40px; background: #fff; border: 1px solid #f0f0f0; text-align: left;">
              
              <div class="mb-4 text-center">
                 <h4 style="font-weight: 700; color: #333; margin-bottom: 8px; letter-spacing: 1px;">个人资料</h4>
                 <p style="color: #888; font-size: 14px;">请完善您的基本信息，以便我们为您提供更准确的咖啡推荐服务</p>
                 <hr style="margin-top: 20px; border-top: 1px dashed #eee;">
              </div>

              <div class="form-group mb-4">
                <label style="font-weight: 600; color: #555; margin-bottom: 10px; font-size: 14px;">
                   <i class="fas fa-user-edit mr-2" style="color: #b5876d;"></i> 账户昵称
                </label>
                <input id="username" th:value="${user.name}" type="text" class="form-control" placeholder="请输入新的用户名" style="border-radius: 6px; padding: 24px 20px; background-color: #fafafa; border: 1px solid #eee;">
              </div>
              
              <div class="form-group mb-4">
                <label style="font-weight: 600; color: #555; margin-bottom: 10px; font-size: 14px;">
                   <i class="fas fa-envelope mr-2" style="color: #b5876d;"></i> 密保邮箱
                </label>
                <input id="email" th:value="${user.email}" type="email" class="form-control form-control-light" placeholder="用于接收订单状态通知和专属卡券" style="border-radius: 6px; padding: 24px 20px; background-color: #fafafa; border: 1px solid #eee;">
              </div>
              
              <div class="form-group mb-5">
                <label style="font-weight: 600; color: #555; margin-bottom: 10px; font-size: 14px;">
                   <i class="fas fa-pen-nib mr-2" style="color: #b5876d;"></i> 个人说明
                </label>
                <textarea id="info" placeholder="写下一句属于你的咖啡物语..." class="form-control form-control-light" style="height: 120px; border-radius: 6px; padding: 20px; background-color: #fafafa; border: 1px solid #eee; resize: none;" th:text="${user.info}"></textarea>
              </div>

              <div class="d-flex justify-content-end">
                <button onclick="updateProfile()" class="andro_btn-custom primary text-center" style="border-radius: 6px; font-weight: 600; padding: 15px 40px; font-size: 16px; transition: all 0.3s; box-shadow: 0 4px 10px rgba(181, 135, 109, 0.3);">
                  <i class="fas fa-save mr-2"></i> 保存资料更改
                </button>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Instagram Start -->
  <div th:replace="common/front-common::#instagram"></div>
  <!-- Instagram End -->

  <!-- Footer Start -->
  <div th:replace="common/front-common::#footer"></div>
  <!-- Footer End -->

  <!-- Vendor Scripts -->
  <script src="front/assets/js/plugins/jquery-3.4.1.min.js"></script>
  <script src="front/assets/js/plugins/popper.min.js"></script>
  <script src="front/assets/js/plugins/waypoint.js"></script>
  <script src="front/assets/js/plugins/bootstrap.min.js"></script>
  <script src="front/assets/js/plugins/jquery.magnific-popup.min.js"></script>
  <script src="front/assets/js/plugins/jquery.slimScroll.min.js"></script>
  <script src="front/assets/js/plugins/imagesloaded.min.js"></script>
  <script src="front/assets/js/plugins/jquery.steps.min.js"></script>
  <script src="front/assets/js/plugins/jquery.countdown.min.js"></script>
  <script src="front/assets/js/plugins/isotope.pkgd.min.js"></script>
  <script src="front/assets/js/plugins/slick.min.js"></script>
  <script src="front/assets/js/plugins/ion.rangeSlider.min.js"></script>
  <script src="front/assets/js/plugins/jquery.zoom.min.js"></script>


  <!-- Coffeez Scripts -->
  <script src="front/assets/js/main.js"></script>
  <script src="common/js/xtiper.min.js"></script>
  <script src="common/js/custom.js"></script>

</body>

</html>
