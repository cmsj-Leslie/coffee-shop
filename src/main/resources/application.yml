# 设置项目上下文路径为 /coffee-shop，即浏览器访问地址需加 /coffee-shop 前缀， 默认为：http://localhost:8080/coffee-shop
server:
  servlet:
    context-path: /coffee-shop

spring:
  mvc:
    # 设置静态资源的访问路径模式（/** 表示匹配所有）
    static-path-pattern: /**

  resources:
    # 静态资源目录位置，classpath:/static/ 对应 resources/static 文件夹
    static-locations: classpath:/static/

  thymeleaf:
    # 禁用模板缓存，开发调试时应为 false，生产环境建议设为 true 提升性能
    cache: false

  # 数据源配置，使用 Druid 数据库连接池
  datasource:
    # 数据库用户名
    username: root
    # 数据库密码
    password: your_database_password
    # JDBC 连接 URL（注意设置时区、编码、affected rows）
    url: jdbc:mysql://127.0.0.1:3306/coffee-shop?serverTimezone=Hongkong&useAffectedRows=true&characterEncoding=utf-8
    # 驱动类（MySQL 8+ 使用 com.mysql.cj.jdbc.Driver）
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 指定连接池实现类
    type: com.alibaba.druid.pool.DruidDataSource

    # 以下为 Druid 性能与稳定性相关配置
    initialSize: 5             # 初始连接数
    minIdle: 5                 # 最小空闲连接数
    maxActive: 20              # 最大活跃连接数
    maxWait: 60000             # 获取连接最大等待时间（毫秒）
    timeBetweenEvictionRunsMillis: 60000       # 连接检查周期
    minEvictableIdleTimeMillis: 300000         # 空闲连接最小生存时间（毫秒）
    validationQuery: SELECT 1 FROM DUAL        # 用于检测连接是否可用
    testWhileIdle: true        # 检测空闲连接时是否执行 validationQuery
    testOnBorrow: false        # 获取连接时是否检测有效性（影响性能）
    testOnReturn: false        # 归还连接时是否检测有效性
    poolPreparedStatements: true  # 启用 PSCache，提升预编译 SQL 性能
    filters: stat,wall         # 开启 SQL 监控和防火墙
    maxPoolPreparedStatementPerConnectionSize: 20
    useGlobalDataSourceStat: true
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500

  # 邮件发送配置：用于找回密码、注册通知等功能（此处为 QQ 邮箱配置）
  mail:
    # 发件人邮箱地址
    username: your_email@qq.com
    # 授权码（不是登录密码！请使用 QQ 邮箱生成的独立授权码）
    password: your_qq_mail_auth_code
    # SMTP 邮件服务器地址（QQ 邮箱）
    host: smtp.qq.com
    # SMTP SSL 端口号（465）
    port: 465
    properties:
      mail:
        smtp:
          auth: true          # 启用认证
          starttls:
            enable: true      # 启用 STARTTLS（适用于 587，但开启对 465 不影响）
            required: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory  # 启用 SSL 套接字工厂
            fallback: false

  # 文件上传配置
  servlet:
    multipart:
      # 上传单个文件的最大大小限制
      max-file-size: 1024MB
      # 单次请求最大文件大小限制（所有文件之和）
      max-request-size: 1024MB

# MyBatis 配置
mybatis:
  # 指定 MyBatis 全局配置文件位置
  config-location: classpath:mybatis/mybatis-config.xml
  # 指定 Mapper XML 文件路径（用于 SQL 映射）
  mapper-locations: classpath:mybatis/mapper/*.xml

# 阿里云 OSS 对象存储配置：用于图片/文件上传至云端
oss:
  # OSS 存储桶名称
  bucket-name: your_bucket_name
  # OSS 区域节点地址（华东杭州）
  end-point: oss-cn-hangzhou.aliyuncs.com
  # 阿里云访问密钥 ID（请在阿里云控制台 RAM 中获取）
  access-key: your_aliyun_access_key_id
  # 阿里云访问密钥 Secret（请在阿里云控制台 RAM 中获取）
  access-secret: your_aliyun_access_key_secret

# 默认用户头像地址（用于新用户注册时的初始头像）
default-avatar: https://your_bucket_name.oss-cn-hangzhou.aliyuncs.com/default.png

# AI API 配置（咖啡咨询助手）
ai:
  # DeepSeek API 配置 - 请在 platform.deepseek.com 获取 API Key
  deepseek:
    api-key: your_deepseek_api_key
    base-url: https://api.deepseek.com/chat/completions
    model: deepseek-chat
  
  # Gemini API 配置 - 请在 aistudio.google.com 获取 API Key
  gemini:
    api-key: your_gemini_api_key
    # CF代理模式使用: https://your_cf_worker_domain/v1beta/models
    # 直连模式使用: https://generativelanguage.googleapis.com/v1beta/models
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    model: gemini-2.0-flash
    # 是否使用代理服务（如 CF Workers 部署的 gemini-balance-lite）
    # true: API Key 通过 Header 传递，适用于 CF 代理，不需要本地梯子
    # false: API Key 通过 URL 参数传递，适用于直连 Google API，需要本地梯子
    use-proxy-service: false
  
  # 代理配置（用于直连 Google API 时使用，use-proxy-service 为 false 时需要）
  proxy:
    enabled: false          # CF代理模式下设为 false，直连模式下设为 true
    host: 127.0.0.1        # 代理服务器地址
    port: 10810             # 代理端口（V2rayN 默认 10810 Clash 默认 7890）
